name: Prettier

on:
  push:
    branches: main
    paths:
      - "**.json"
      - "**.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Prettier
        run: npx --yes prettier --write "*.json"

      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "ci: formatting"
            git push
          fi
