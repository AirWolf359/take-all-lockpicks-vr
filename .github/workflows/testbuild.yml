name: Test Build

on:
  push:
    branches: main
    paths:
      - "**.h"
      - "**.cpp"
      - "**.yml"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "cmake/**"
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  test-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Import the VS developer environment (cl, ninja deps, INCLUDE/LIB)
      # using the runner's vswhere — no third-party action needed.
      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          & cmd /s /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" |
            ForEach-Object {
              $name, $value = $_ -split '=', 2
              if ($name -and $value) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }

      - name: Setup vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
          cd $env:VCPKG_INSTALLATION_ROOT
          ./bootstrap-vcpkg.bat
          ./vcpkg --version > "${{ github.workspace }}/vcpkg-version.txt"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}/*
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-version.txt') }}

      - name: Configure
        run: cmake --preset build-${{ matrix.preset }}-msvc

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          $folder = if ("${{ matrix.preset }}" -eq "release") { "PluginRelease" } else { "PluginDebug" }
          New-Item -ItemType Directory -Force artifact/SKSE/Plugins | Out-Null
          Copy-Item "contrib/$folder/skse/plugins/*" artifact/SKSE/Plugins/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TakeAllLockpicksVR-${{ matrix.preset }}
          path: artifact/
