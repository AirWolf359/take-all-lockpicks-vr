name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
          cd $env:VCPKG_INSTALLATION_ROOT
          ./bootstrap-vcpkg.bat
          ./vcpkg --version > "${{ github.workspace }}/vcpkg-version.txt"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}/*
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-version.txt') }}

      - name: Configure
        run: cmake --preset build-release-msvc

      - name: Build
        run: cmake --build --preset release-msvc

      - name: Package mod archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force stage/SKSE/Plugins | Out-Null
          Copy-Item contrib/PluginRelease/skse/plugins/TakeAllLockpicksVR.dll stage/SKSE/Plugins/
          Compress-Archive -Path stage/* -DestinationPath "TakeAllLockpicksVR-$version.zip"
          Compress-Archive -Path contrib/PluginRelease/skse/plugins/TakeAllLockpicksVR.pdb -DestinationPath "TakeAllLockpicksVR-$version-pdb.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}"
          gh release create $version `
            "TakeAllLockpicksVR-$version.zip#Mod archive (install with a mod manager)" `
            "TakeAllLockpicksVR-$version-pdb.zip#Debug symbols (for crash log symbolication)" `
            --title "Take All Lockpicks VR $version" `
            --generate-notes
